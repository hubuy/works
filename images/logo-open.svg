<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Hubert pizza box, open">
  <g stroke="#23211f" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- tuck tab, now pointing up from the open lid -->
    <path d="M44 3.5 Q44 1.5 46 1.5 H54 Q56 1.5 56 3.5 V7 H44 Z" fill="#e9dfcf"/>
    <!-- lid front flap (far edge now) -->
    <path d="M20 7 H80 L80.8 12 H19.2 Z" fill="#e9dfcf"/>
    <!-- lid, open and leaning back (inside face) -->
    <path d="M19.2 12 H80.8 L88.5 36 H11.5 Z" fill="#efe6d8"/>
    <!-- tray interior -->
    <path d="M11.5 36 H88.5 L92.6 57 H7.4 Z" fill="#d6c8b2"/>
  </g>
  <!-- pizza -->
  <g>
    <ellipse cx="50" cy="47.5" rx="33.5" ry="11.5" fill="#F4C542"/>
    <ellipse cx="50" cy="47.5" rx="33.5" ry="11.5" fill="none" stroke="#D4943A" stroke-width="3"/>
    <!-- slice cuts -->
    <path d="M50 47.5 L30 56.5 M50 47.5 L70 56.5 M50 47.5 L50 36" stroke="#D4943A" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
    <circle cx="36" cy="45" r="2.5" fill="#C0392B" opacity="0.9"/>
    <circle cx="55" cy="41.5" r="2.3" fill="#C0392B" opacity="0.9"/>
    <circle cx="65" cy="48.5" r="2.5" fill="#C0392B" opacity="0.9"/>
    <circle cx="44" cy="52" r="2.2" fill="#C0392B" opacity="0.9"/>
    <circle cx="58" cy="52.5" r="2.1" fill="#C0392B" opacity="0.9"/>
  </g>
  <g stroke="#23211f" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- body front -->
    <path d="M7.4 57 H92.6 V73 Q92.6 77 88.6 77 H11.4 Q7.4 77 7.4 73 Z" fill="#dccfbc"/>
    <!-- tab slot -->
    <path d="M43 61.5 H57" />
  </g>
</svg>
